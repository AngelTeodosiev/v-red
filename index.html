<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>V-red Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: flat 2D workshop app. White ground, navy ink from the logo, red only for navigation motion, alerts and the brand. */
:root{
  color-scheme:light;
  --bg:#ffffff; --panel:#f3f6f8; --panel-2:#e6edf2; --ink:#00273d; --ink-2:#3d5a6e; --line:#d5e0e7;
  --red:#ff1616; --red-ink:#c40c0c; --red-soft:#ffe8e8;
  --go:#14915a; --go-soft:#e1f4ea; --amber:#f2a516; --amber-soft:#fff3d9; --amber-ink:#7a4d00;
  --f-display:"Montserrat","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --tap:60px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;font-weight:800;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:21px} h3{font-size:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:72px;padding-block:8px;flex-wrap:wrap}
.logo{height:40px;width:auto;display:block}
.bar .who{display:flex;flex-direction:column;line-height:1.2;min-width:0;padding-left:12px;border-left:2px solid rgba(255,255,255,.25)}
.bar .who b{font-size:16px}
.bar .who small{color:#b9cbd8;font-size:13px}
.bar .back{color:#fff;background:transparent}
.bar :focus-visible{outline-color:#fff}
.bar .sp{flex:1}
.lang{display:inline-flex;border:2px solid #fff;border-radius:10px;overflow:hidden}
.lang button{border:0;background:transparent;color:#fff;min-width:50px;min-height:42px;font-weight:700;font-size:14px;letter-spacing:.04em}
.lang button.on{background:#fff;color:var(--ink)}
.navline{position:fixed;top:0;left:0;height:4px;background:var(--red);z-index:30;width:0;pointer-events:none}
.navline.go{animation:navgo .55s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes navgo{0%{width:0;opacity:1}80%{width:100%;opacity:1}100%{width:100%;opacity:0}}

main{padding-block:22px 130px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.grid.tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.view-in{animation:viewin .28s ease-out}
@keyframes viewin{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* buttons: flat */
.btn{min-height:var(--tap);padding:0 22px;border-radius:var(--r);border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation;transition:background .15s,color .15s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--ink);color:#fff}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.pause{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn.danger{background:var(--bg);border-color:var(--red);color:var(--red-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:48px;padding:0 16px;font-size:15px}
.btn.xl{min-height:74px;font-size:20px;padding:0 26px}
.btn.wide{width:100%}
.back{min-height:50px;padding:0 14px 0 8px;border-color:transparent}
svg.i{width:24px;height:24px;flex:none}

/* tiles */
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:22px;border-radius:16px;border:2px solid var(--line);background:var(--bg);text-align:left;min-height:160px;position:relative;overflow:hidden;transition:border-color .2s}
.tile::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--red);transition:width .3s ease}
.tile:hover,.tile:focus-visible{border-color:var(--ink)}
.tile:hover::after,.tile:focus-visible::after,.tile:active::after{width:100%}
.tile .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--ink);color:#fff}
.tile .ic svg{width:30px;height:30px}
.tile b{font-family:var(--f-display);font-size:21px;font-weight:800}
.tile span{color:var(--ink-2);font-size:15px}
.tile .badge{position:absolute;top:16px;right:16px}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-family:var(--f-display);font-weight:800;font-size:20px}
.badge{min-width:28px;height:28px;padding:0 8px;border-radius:99px;background:var(--red);color:#fff;font-weight:800;font-size:14px;display:inline-grid;place-items:center}
.badge.n{background:var(--ink)}

/* cards */
.card{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tap{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s}
.card.tap:hover{border-color:var(--ink)}
.card.dim{opacity:.6}
.card.flat{background:var(--panel);border-color:var(--panel)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.s-go{border-left:8px solid var(--go)} .s-amber{border-left:8px solid var(--amber)} .s-red{border-left:8px solid var(--red)} .s-idle{border-left:8px solid var(--line)}

/* Quebec plate */
.plate{display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);padding:1px 10px 2px;line-height:1;white-space:nowrap}
.plate small{font-size:8px;font-weight:800;letter-spacing:.2em;color:#1d4f9a;margin-top:2px}
.plate b{font-family:var(--f-mono);font-size:19px;font-weight:700;letter-spacing:.06em}
.plate i{font-size:7px;font-style:italic;color:#1d4f9a;margin-top:1px}
.plate.lg{padding:3px 16px 4px}.plate.lg b{font-size:30px}.plate.lg small{font-size:10px}.plate.lg i{font-size:9px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap}
.p-new{background:var(--ink);color:#fff}
.p-assigned{background:var(--panel-2);color:var(--ink)}
.p-working{background:var(--go-soft);color:var(--go)}
.p-paused{background:var(--amber-soft);color:var(--amber-ink)}
.p-done{background:var(--go);color:#fff}
.p-closed{background:var(--panel);color:var(--ink-2)}
.p-late{background:var(--red);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.p-working .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.2}}

/* tasks */
.task{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px;border-radius:14px;background:var(--panel)}
.task.run{background:var(--go-soft);box-shadow:inset 0 0 0 2px var(--go)}
.task.done{opacity:.7}
.task .nm{font-weight:700;font-size:19px}
.task .meta{color:var(--ink-2);font-size:15px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.task .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.timer.big{font-size:22px}
.over{color:var(--red-ink);font-weight:700}

/* inputs */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:var(--ink-2);min-width:0}
.in{min-height:var(--tap);border:2px solid var(--line);border-radius:var(--r);background:var(--bg);padding:0 16px;font-size:18px;width:100%;color:var(--ink)}
textarea.in{padding:12px 16px;min-height:86px;resize:vertical}
.in:focus{border-color:var(--ink);outline:none}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chipb{min-height:52px;padding:0 18px;border-radius:99px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:16px;transition:background .15s,border-color .15s}
.chipb:hover{border-color:var(--ink)}
.chipb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step{display:inline-flex;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:12px}
.step button{width:48px;height:48px;border:0;background:transparent;font-size:24px;font-weight:700}
.step .v{min-width:70px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:17px}

/* tabs with red sliding ink */
.tabs{display:flex;gap:4px;flex-wrap:wrap;position:relative;border-bottom:2px solid var(--line);overflow:hidden}
.tab{min-height:56px;padding:0 18px;border:0;background:transparent;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.tab.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-2px;height:4px;background:var(--red);border-radius:2px;transition:left .3s cubic-bezier(.3,.8,.3,1),width .3s cubic-bezier(.3,.8,.3,1),top .3s}

/* KPI */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--panel);border-radius:14px;padding:14px 16px}
.kpi small{display:block;color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi.alert{background:var(--red-soft)} .kpi.alert b{color:var(--red-ink)}
.meter{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px}
.meter i.g{background:var(--go)} .meter i.w{background:var(--amber)} .meter i.s{background:var(--red)}

.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
th{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;background:var(--panel)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:800;background:var(--panel)}

.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--panel)}
.confirm{border:2px solid var(--amber);background:var(--amber-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{padding:34px 20px;text-align:center;color:var(--ink-2);background:var(--panel);border-radius:16px}
.note{background:var(--panel);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink-2)}
.alertline{background:var(--red-soft);color:var(--red-ink);padding:12px 14px;border-radius:12px;font-weight:700;font-size:15px}
.okline{background:var(--go-soft);color:var(--go);padding:12px 14px;border-radius:12px;font-weight:700;font-size:15px}
.hidefile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sel{box-shadow:0 0 0 3px var(--red)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:flex;gap:10px;padding-block:10px;flex-wrap:wrap}
.dock .btn{flex:1 1 170px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:#fff;padding:14px 22px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);border-left:6px solid var(--red)}

/* PIN pad */
.pin{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center}
.pindots{display:flex;gap:16px}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.pindots.err i{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.keypad button{height:76px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-family:var(--f-display);font-size:28px;font-weight:800}
.keypad button:active{background:var(--ink);color:#fff}

/* invoice */
.invoice{border:2px solid var(--ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;max-width:820px}
.invoice .head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  h1{font-size:23px}
  .logo{height:32px}
  .task{grid-template-columns:1fr}
  .task .acts .btn{flex:1}
  .plate.lg b{font-size:24px}
  .bar .who{display:none}
  .lang button{min-width:38px;min-height:40px;font-size:13px}
  .bar .wrap{gap:8px}
}
</style>
</head>

<header class="bar"><div class="wrap" id="bar"></div></header>
<main class="wrap" id="app"><div class="empty">…</div></main>

<input type="file" id="fileCam" accept="image/*" capture="environment" class="hidefile" aria-hidden="true" tabindex="-1">

const fmtDay = ts => { if(!ts) return "–"; const d=new Date(ts); return d.toDateString()===new Date().toDateString() ? t("today").toLowerCase()+" "+fmtTime(ts) : d.toLocaleDateString(loc(),{day:"2-digit",month:"2-digit"})+" "+fmtTime(ts); };
const money = v => Number(v).toLocaleString(loc(),{style:"currency",currency:"CAD"});

const at = (dayOffset, hour) => { const x=new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate()+dayOffset); return x.getTime()+hour*H; };

/* ================= store (local demo, synced between tabs) ================= */
const KEY = "vred-demo-v2";
const COLLS = ["staff","clients","services","parts","orders","requests","invoices","log","settings"];
const store = (() => {
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e){ return null; } };
  let data = load();
  let bc = null; try { bc = new BroadcastChannel(KEY); } catch(e){}
  let mem = !data;
  if(!data) data = {};
  COLLS.concat(["photos"]).forEach(c => { data[c] = data[c] || {}; });
  const subs = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} if(bc) bc.postMessage(1); subs.forEach(f=>f()); };
  if(bc) bc.onmessage = () => { const d=load(); if(d){ data=d; subs.forEach(f=>f()); } };
  return {
    empty: () => !Object.keys(data.staff).length,
    list: c => Object.entries(data[c]).map(([id,v]) => Object.assign({id}, v)),
    get: (c,id) => data[c][id] ? Object.assign({id}, data[c][id]) : null,
    set(c,id,v){ data[c][id]=v; },
    update(c,id,p){ data[c][id]=Object.assign({}, data[c][id], p); },
    remove(c,id){ delete data[c][id]; },
    wipe(){ COLLS.concat(["photos"]).forEach(c=>data[c]={}); },
    commit: save,
    on: f => subs.push(f)
  };
})();

const runningOf = mid => { for(const o of orders()){ if(o.mechanicId!==mid) continue; const tk=(o.tasks||[]).find(x=>x.state==="run"); if(tk) return {o,tk}; } return null; };

function placeInk(){
  document.querySelectorAll(".tabs").forEach(tb => {
    const on = tb.querySelector(".tab.on"); let ink = tb.querySelector(".ink");
    if(!ink){ ink=document.createElement("i"); ink.className="ink"; tb.appendChild(ink); }
    if(!on){ ink.style.width="0"; return; }
    const prev = tb.dataset.k && window.__ink && window.__ink[tb.dataset.k];
    const target = {left:on.offsetLeft, width:on.offsetWidth, top:on.offsetTop+on.offsetHeight-2};
    if(prev){ ink.style.transition="none"; Object.assign(ink.style,{left:prev.left+"px",width:prev.width+"px",top:prev.top+"px"}); void ink.offsetWidth; ink.style.transition=""; }
    Object.assign(ink.style,{left:target.left+"px",width:target.width+"px",top:target.top+"px",bottom:"auto"});
    if(tb.dataset.k){ window.__ink=window.__ink||{}; window.__ink[tb.dataset.k]=target; }
  });
}

function toast(m){ const el=$("#toast"); el.textContent=m; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true;},2800); }
const commit = () => { store.commit(); };
function stopSeg(x,now,ns){ return x.state==="run"&&x.segStart ? Object.assign({},x,{state:ns,workedMs:(x.workedMs||0)+(now-x.segStart),segs:(x.segs||[]).concat([[x.segStart,now]]),segStart:null}) : Object.assign({},x,{state:ns}); }
function taskAction(oid,tid,act){
  const now=Date.now(), o=get("orders",oid); if(!o) return;
  if(act==="start") orders().filter(z=>z.mechanicId===o.mechanicId&&z.id!==o.id&&(z.tasks||[]).some(x=>x.state==="run")).forEach(z=>store.update("orders",z.id,{tasks:z.tasks.map(x=>x.state==="run"?stopSeg(x,now,"pause"):x),status:"paused"}));
  let nm="";
  const tasks=o.tasks.map(x=>{ if(x.id===tid){ nm=taskName(x);
      if(act==="start") return Object.assign({},x,{state:"run",segStart:now,startedAt:x.startedAt||now});
      if(act==="pause") return stopSeg(x,now,"pause");
      if(act==="finish") return Object.assign(stopSeg(x,now,"done"),{finishedAt:now}); }
    if(act==="start"&&x.state==="run") return stopSeg(x,now,"pause"); return x; });
  const running=tasks.some(x=>x.state==="run");
  const patch={tasks,status:running?"working":tasks.some(x=>x.state!=="todo")?"paused":"assigned"}; if(act==="start"&&!o.startedAt) patch.startedAt=now;
  store.update("orders",o.id,patch); log({start:"start",pause:"pause",finish:"finish"}[act], o.plate+" · "+nm); commit();
  if(act==="finish"&&!tasks.some(x=>["todo","run","pause"].includes(x.state))) toast(t("tAllDone"));
}
function finishOrder(oid){
  const now=Date.now(), o=get("orders",oid); if(!o) return;
  const tasks=o.tasks.map(x=>x.state==="run"?Object.assign(stopSeg(x,now,"done"),{finishedAt:now}):x.state==="pause"?Object.assign({},x,{state:"done",finishedAt:now}):x.state==="todo"?Object.assign({},x,{state:"skipped"}):x);
  store.update("orders",oid,{tasks,status:"done",finishedAt:now}); log("ready",o.plate+" · "+o.car); commit(); toast(t("tReady")); go("mech");
}

/* photos & scan */
async function shrink(file,max=1600,q=0.75){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  const draw=(m)=>{ const k=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c; };
  let d=draw(max).toDataURL("image/webp",q); if(!d.startsWith("data:image/webp")) d=draw(max).toDataURL("image/jpeg",q);
  if(d.length>450000) d=draw(1000).toDataURL("image/jpeg",0.6);
  URL.revokeObjectURL(img.src); return d;
}

  const p=all("parts").find(x=>x.code===code||x.ean===code);
  if(p){ S.q=""; S.pick=S.view==="mechParts"?{id:p.id,qty:1}:{id:p.id}; paint(); toast(t("tScanFound",{x:tr(p.name)})); } else { S.q=code; paint(); toast(t("tScanMissing",{x:code})); }
});

/* ================= events ================= */
function signIn(m){
  S.me=m.id; S.role=m.role; lsSet("vr.me",S.me); lsSet("vr.role",S.role); S.unlockUntil=0;
  log("login",""); commit();
  go({mechanic:"mech",admin:"admin",manager:"manager",clerk:"clerk"}[m.role],{tab:null,ctab:"req",filter:"active",pw:"",pin:"",pinErr:false});
}
function signOut(){ if(S.me){ log("logout",""); commit(); } S.me=null; S.role=null; S.unlockUntil=0; lsSet("vr.me",null); lsSet("vr.role",null); go("home",{tab:null}); }
document.addEventListener("click", e => {
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return; const d=b.dataset, a=d.act;
  if(b.type!=="submit") e.preventDefault();
  switch(a){
    case "lang": lang=d.l; lsSet("vr.lang",lang); paint(); break;
    case "role": S.role=d.role;
      if(d.role==="mechanic") go("pickMech");
      else { const p=staff().find(s=>s.role===d.role&&s.active!==false); if(p) go("login",{loginFor:p.id,pw:"",pin:"",pinErr:false}); setTimeout(()=>{const x=$("#pw"); if(x) x.focus();},60); } break;
    case "back": S.form=null; S.editClient=false; if(d.to==="home"){ S.role=null; } go(d.to); break;
    case "logout": signOut(); break;
    case "go": go(d.to); break;
    case "askReset": S.confirm="reset"; paint(); break;
    case "doReset": seed(); S.confirm=null; toast(t("tReset")); paint(); break;
    case "cancelConfirm": S.confirm=null; S.pw=""; S.pinErr=false; paint(); break;
    case "pickMech": go("login",{loginFor:d.id,pin:"",pinErr:false}); break;
    case "pinKey": { const m=get("staff",S.loginFor); if(!m) break; if(d.k==="del") S.pin=S.pin.slice(0,-1); else if(S.pin.length<4) S.pin+=d.k; S.pinErr=false;
      if(S.pin.length===4){ if(S.pin===m.pw){ signIn(m); return; } S.pinErr=true; S.pin=""; } paint(); break; }
    case "openMechOrder": go("mechOrder",{orderId:d.id}); break;
    case "openAdminOrder": case "openMgrOrder": go("adminOrder",{orderId:d.id}); break;
    case "openClient": go("client",{clientId:d.id,pw:"",pinErr:false}); break;
    case "clientNew": S.form={name:"",phone:"",car:"",plate:""}; go("clientEdit",{clientId:null}); break;
    case "clientEditOpen": { const c=get("clients",d.id); S.form={name:c.name,phone:c.phone,car:c.car,plate:c.plate}; go("clientEdit",{clientId:c.id}); break; }
    case "askDelClient": S.confirm="delClient"; S.pw=""; S.pinErr=false; paint(); setTimeout(()=>{const x=$("#dpw"); if(x) x.focus();},60); break;
    case "openInvoice": go("invoice",{invId:d.id}); break;
    case "task": taskAction(d.o,d.tk,d.do); break;
    case "askFinish": S.confirm="finish"; paint(); setTimeout(()=>{const c=document.querySelector(".confirm"); if(c) c.scrollIntoView({behavior:"smooth",block:"center"});}); break;
    case "finishOrder": finishOrder(d.id); break;
    case "addTaskMech": { const o=get("orders",S.orderId), s=svc(d.id); if(o&&s){ store.update("orders",o.id,{tasks:o.tasks.concat([{id:uid(),svcId:s.id,name:null,normH:s.normH,rate:rate(),price:s.price,state:"todo",workedMs:0,segStart:null,segs:[],startedAt:null,finishedAt:null}])}); commit(); toast(t("tAddTask",{x:tr(s.name)})); } break; }
    case "photo": $("#fileCam").click(); break;
    case "scan": $("#fileScan").click(); break;
    case "pickPart": S.pick={id:d.id,qty:1}; paint(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "pickStock": S.pick={id:d.id}; paint(); break;
    case "unpick": S.pick=null; paint(); break;
    case "qty": S.pick.qty=Math.max(1,S.pick.qty+(+d.d)); paint(); break;
    case "sendReq": sendReq(); break;
    case "newOrder": S.form=newForm(); go("adminNew"); setTimeout(()=>{const q=$("#q"); if(q) q.focus();},60); break;
    case "newOrderFor": S.form=newForm(d.id); go("adminNew"); break;
    case "pickClient": S.form.clientId=d.id; S.q=""; paint(); break;
    case "unclient": S.form.clientId=null; paint(); break;
    case "newClientForm": S.form.newClient=true; if(/\d/.test(S.q)) S.form.phone=S.q; else S.form.name=S.q; S.q=""; paint(); break;
    case "pickExisting": S.form.newClient=false; paint(); break;
    case "filter": S.filter=d.v; S.q=""; paint(); break;
    case "svcToggle": { const F=S.form, i=F.tasks.findIndex(x=>x.svcId===d.id); if(i>=0) F.tasks.splice(i,1); else F.tasks.push({svcId:d.id,normH:svc(d.id).normH}); paint(); break; }
    case "svcOther": S.form.tasks.push({svcId:null,name:"",normH:1.0}); paint(); setTimeout(()=>{const el=$("#f_task_"+(S.form.tasks.length-1)); if(el) el.focus();}); break;
    case "svcRemove": S.form.tasks.splice(+d.i,1); paint(); break;
    case "norm": { const x=S.form.tasks[+d.i]; x.normH=Math.max(0.1,Math.round((x.normH+(+d.d))*10)/10); paint(); break; }
    case "due": S.form.dueIn=d.k; paint(); break;
    case "urgent": S.form.urgent=!S.form.urgent; paint(); break;
    case "closeOrder": closeOrder(d.id); break;
    case "copy": { const x=d.x; try{ navigator.clipboard.writeText(x).then(()=>toast(t("tCopied",{x})),()=>toast(x)); }catch(err){ toast(x); } break; }
    case "tab": S.tab=d.v; S.q=""; S.pick=null; S.form=null; S.formErr=null; S.pw=""; S.pinErr=false; paint(); break;
    case "ctab": S.ctab=d.v; S.q=""; S.pick=null; S.form=null; S.formErr=null; S.pw=""; S.pinErr=false; paint(); break;
    case "cp": S.cp=d.v; S.form=null; S.formErr=null; paint(); break;
    case "lockCp": S.unlockUntil=0; S.pw=""; paint(); break;
    case "period": S.period=d.v; paint(); break;
    case "jWho": S.jWho=d.id; paint(); break;
    case "assign": assign(d.o,d.m); break;
    case "approve": decide(d.id,true); break;
    case "reject": decide(d.id,false); break;
    case "restock": restock(d.id,+d.n); break;
    case "pay": pay(d.id,d.m); break;
    case "svcNorm": changeNorm(d.id,+d.d); break;
    case "svcPrice": changeSvcPrice(d.id,+d.d); break;
    case "pPrice": changePart(d.id,"price",+d.d); break;
    case "pMin": changePart(d.id,"min",+d.d); break;
    case "pQty": changePart(d.id,"qty",+d.d); break;
    case "rate": changeRate(+d.d); break;
    case "staffToggle": { const s=get("staff",d.id); if(!s) break; const on=s.active===false; store.update("staff",s.id,{active:on}); log(on?"staffon":"staffoff",s.name); commit(); break; }
    case "pwReset": { const s=get("staff",d.id); if(!s) break; const p=s.role==="mechanic"?String(1000+Math.floor(Math.random()*9000)):"vred"+Math.floor(100+Math.random()*900); store.update("staff",s.id,{pw:p}); log("pwreset",s.name); commit(); toast(t("tPwReset",{x:s.name,p})); break; }
    case "addStaff": { const n=(S.newStaff||"").trim(); if(!n){ const x=$("#s_name"); if(x) x.focus(); break; }
      const id=uid(), lift=d.r==="mechanic"?1+Math.max(0,...mechs().map(m=>m.lift)):0;
      store.set("staff",id,{name:n,role:d.r,lift,active:true,pw:{mechanic:"1234",admin:"accueil",clerk:"commis"}[d.r]}); log("newstaff",n+" · "+t("r_"+d.r)); commit(); S.newStaff=""; toast(t("staffAdded")); paint(); break; }
  }
});
document.addEventListener("keydown", e => { if(e.key==="Enter" && e.target.matches("tr[data-act]")) e.target.click(); });
document.addEventListener("input", e => {
  const el=e.target, id=el.id;
  if(id==="q"){ S.q=el.value; paint(); return; }
  if(id==="pw"||id==="upw"||id==="dpw"){ S.pw=el.value; return; }
  if(id==="s_name"){ S.newStaff=el.value; return; }
  if(/^n_/.test(id)){ S.form=S.form&&S.form.kind==="part"?S.form:{kind:"part",name:"",code:"",price:"",qty:"",min:"",loc:""}; S.form[id.slice(2)]=el.value; return; }
  if(/^c_/.test(id)&&S.form){ let v=el.value; if(id==="c_plate"){ v=normPlate(v); if(v!==el.value){ const p=el.selectionStart; el.value=v; try{el.setSelectionRange(p,p);}catch(err){} } } S.form[id.slice(2)]=v; return; }
  if(S.view==="adminNew"&&S.form){
    if(el.dataset.ti!=null){ S.form.tasks[+el.dataset.ti].name=el.value; return; }
    if(id==="f_plate"){ const v=normPlate(el.value); if(v!==el.value){ const p=el.selectionStart; el.value=v; try{el.setSelectionRange(p,p);}catch(err){} } S.form.plate=v; return; }
    const f=id.replace("f_",""); if(f in S.form) S.form[f]=el.value;
  }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const id=e.target.id;
  if(id==="newForm") createOrder();
  else if(id==="loginForm"){ const m=get("staff",S.loginFor); if(m&&S.pw===m.pw) signIn(m); else { S.pinErr=true; S.pw=""; paint(); } }
  else if(id==="unlockForm"){ const m=get("staff",S.me); if(m&&S.pw===m.pw){ S.unlockUntil=Date.now()+10*60e3; S.pw=""; S.pinErr=false; log("unlock",""); commit(); paint(); } else { S.pinErr=true; S.pw=""; log("failpw",t("control")); commit(); } }
  else if(id==="delForm"){ const mg=staff().find(s=>s.role==="manager"); const c=get("clients",S.clientId);
    if(mg&&c&&S.pw===mg.pw){ store.remove("clients",c.id); log("delclient",c.name+" · "+c.plate); commit(); toast(t("tDeleted")); S.pw=""; S.pinErr=false; go(S.role==="manager"?"manager":"admin",{filter:"clients",tab:"orders"}); }
    else { S.pinErr=true; S.pw=""; log("failpw",t("deleteClient")+(c?" · "+c.name:"")); commit(); } }
  else if(id==="clientForm"){ const F=S.form; if(!F.name.trim()||normPlate(F.plate).trim().length<3){ S.formErr=t("errClient"); paint(); return; }
    const v={name:F.name.trim(),phone:F.phone.trim(),car:F.car.trim()||"—",plate:normPlate(F.plate).trim()};
    if(S.clientId){ store.update("clients",S.clientId,v); log("editclient",v.name+" · "+v.plate); commit(); toast(t("tClientSaved")); S.form=null; go("client"); }
    else { const cid=uid(); store.set("clients",cid,v); log("newclient",v.name+" · "+v.plate); commit(); toast(t("tClientSaved")); S.form=null; go("client",{clientId:cid}); } }
  else if(id==="partForm") addPart();
});
try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}

/* ================= boot ================= */
store.on(() => paint());
if(store.empty()) seed();
if(S.me && !get("staff",S.me)) S.me=null;
if(S.me){ const m=get("staff",S.me); S.role=m.role; S.view={mechanic:"mech",admin:"admin",manager:"manager",clerk:"clerk"}[m.role]; } else { S.view="home"; S.role=null; }
paint();
})();
</script>

<div id="installBar" hidden style="position:fixed;left:0;right:0;bottom:0;z-index:40;background:#00273D;color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:4px solid #FF1616">
  <img src="icons/icon-192.png" alt="" width="44" height="44">
  <span id="installTxt" style="flex:1 1 200px;font-weight:600"></span>
  <button id="installBtn" class="btn" style="background:#fff;color:#00273D;border-color:#fff;min-height:52px"></button>
  <button id="installX" class="btn" style="background:transparent;color:#fff;border-color:transparent;min-height:52px" aria-label="Fermer">✕</button>
</div>
<script>
(function(){
  if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  const fr=(localStorage.getItem("vr.lang")||"fr")!=="en";
  const bar=document.getElementById("installBar"), txt=document.getElementById("installTxt"), btn=document.getElementById("installBtn");
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  let dismissed=false; try{dismissed=localStorage.getItem("vr.installX")==="1";}catch(e){}
  if(standalone||dismissed) return;
  document.getElementById("installX").onclick=()=>{bar.hidden=true;try{localStorage.setItem("vr.installX","1");}catch(e){}};
  let ev=null;
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); ev=e; txt.textContent=fr?"Installer V-red sur cet appareil":"Install V-red on this device"; btn.textContent=fr?"Installer":"Install"; btn.hidden=false; bar.hidden=false; });
  btn.onclick=async()=>{ if(!ev) return; ev.prompt(); await ev.userChoice; ev=null; bar.hidden=true; };
  window.addEventListener("appinstalled",()=>{bar.hidden=true;});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(ios){ txt.textContent=fr?"Pour installer : touchez Partager ⬆︎ puis « Sur l’écran d’accueil »":"To install: tap Share ⬆︎ then “Add to Home Screen”"; btn.hidden=true; bar.hidden=false; }
})();
</script>
